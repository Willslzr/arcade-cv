<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060a" />

    <title>William E. Salazar O. — Analista de Requerimientos &amp; Desarrollador</title>
    <meta
      name="description"
      content="CV interactivo de William E. Salazar O. Analista de requerimientos y desarrollador (JavaScript, Vue, Node, Laravel, SQL). Con un shoot'em up escrito desde cero sobre Canvas."
    />
    <link rel="canonical" href="https://TU-DOMINIO.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/img/avatar.jpeg" />

    <!-- Precarga de fuentes: evita el salto de tipografía al pintar -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- El atlas se pide en paralelo con el JS, no después -->
    <link rel="preload" as="image" href="/assets/atlas.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="William E. Salazar O. — Analista &amp; Desarrollador" />
    <meta
      property="og:description"
      content="Un CV que se convierte en videojuego. Vue 3, Canvas 2D y un motor escrito desde cero."
    />
    <meta property="og:url" content="https://TU-DOMINIO.com/" />
    <meta property="og:image" content="https://TU-DOMINIO.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos estructurados: ayuda a que Google entienda que esto es
         una persona con un puesto, no una página cualquiera -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "William E. Salazar O.",
        "jobTitle": "Analista de Requerimientos y Desarrollador",
        "email": "mailto:williamyenn@gmail.com",
        "url": "https://TU-DOMINIO.com/",
        "knowsAbout": ["JavaScript", "Vue.js", "Node.js", "Laravel", "SQL"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="font-family: monospace; color: #d9e6e2; padding: 2rem">
        Este CV necesita JavaScript para funcionar. Puedes escribirme a
        <a href="mailto:williamyenn@gmail.com">williamyenn@gmail.com</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
